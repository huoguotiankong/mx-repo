name: Publish Dongman Manhua Plus v1.6.3 handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dongmanmanhuaplus-v3-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dongmanmanhuaplus-v3-handoff
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validated handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: handoff
          persist-credentials: false

      - name: Checkout distribution repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          path: dist
          fetch-depth: 0

      - name: Verify staged test and production payloads
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='c2a9e3cf359d8fca94eaade7bbe7de28047bccb9'
          pkg='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus'
          apk='tachiyomi-zh.dongmanmanhuaplus-v1.6.3.apk'
          jar='tachiyomi-zh.dongmanmanhuaplus-v1.6.3.jar'
          prod='handoff/production-handoff'
          testroot='handoff/test'

          test "$(tr -d '\r\n' < "$prod/SOURCE_SHA.txt")" = "$expected_sha"
          test -f "$prod/$apk"
          test -f "$prod/$jar"
          test -f "$prod/index.json"
          test -f "$prod/index.pb"
          test -f "$prod/index-android.json"
          test -f "$testroot/index.json"
          test -f "$testroot/repo.json"
          test -f "$testroot/apk/$apk"
          test -f "$testroot/icon/${pkg}-v106003.png"

          python3 - <<'PY'
          import json
          pkg='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus'
          checks=[
              ('handoff/production-handoff/index.json', 106003),
              ('handoff/production-handoff/index-android.json', 106003),
              ('handoff/test/index.json', 106003),
          ]
          for path, code in checks:
              d=json.load(open(path, encoding='utf-8'))
              e=[x for x in d['extensionList']['extensions'] if x['packageName']==pkg]
              assert len(e)==1, (path, len(e))
              e=e[0]
              assert e['versionName']=='1.6.3', (path, e)
              assert int(e['versionCode'])==code, (path, e)
              assert e['sources'][0]['language']=='zh', (path, e)
              assert int(e['sources'][0]['id'])==4940002032762570168, (path, e)
              print('verified', path, e['versionName'], e['versionCode'], e['sources'][0]['language'])
          PY

      - name: Stage both stores
        shell: bash
        run: |
          set -euo pipefail
          prod='handoff/production-handoff'

          # Test store is a complete preserved snapshot generated from the previous staging state.
          rm -rf dist/test
          cp -a handoff/test dist/test

          # Production handoff contains only files changed by this targeted release.
          while IFS= read -r -d '' file; do
            rel="${file#$prod/}"
            test "$rel" = 'SOURCE_SHA.txt' && continue
            mkdir -p "dist/$(dirname "$rel")"
            cp -a "$file" "dist/$rel"
          done < <(find "$prod" -type f -print0)

          python3 - <<'PY'
          import json
          pkg='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus'
          for path in ['dist/index.json','dist/index-android.json','dist/test/index.json']:
              d=json.load(open(path, encoding='utf-8'))
              e=[x for x in d['extensionList']['extensions'] if x['packageName']==pkg][0]
              assert e['versionName']=='1.6.3', (path,e)
              assert int(e['versionCode'])==106003, (path,e)
              assert e['sources'][0]['language']=='zh', (path,e)
          PY

      - name: Commit production and test repositories
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Dongman Manhua Plus v1.6.3 is already published to both stores'
          else
            git commit -m 'Publish Dongman Manhua Plus v1.6.3'
            git pull --rebase origin repo
            git push origin HEAD:repo
          fi

      - name: Verify public formal and test stores
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo'
          apk='tachiyomi-zh.dongmanmanhuaplus-v1.6.3.apk'
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -fsSL "$base/index.json?attempt=$attempt" -o /tmp/formal.json || true
            curl -fsSL "$base/test/index.json?attempt=$attempt" -o /tmp/test.json || true
            if FORMAL=/tmp/formal.json TEST=/tmp/test.json python3 - <<'PY'
          import json, os, sys
          pkg='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus'
          try:
              for key in ['FORMAL','TEST']:
                  d=json.load(open(os.environ[key], encoding='utf-8'))
                  e=[x for x in d['extensionList']['extensions'] if x['packageName']==pkg][0]
                  assert e['versionName']=='1.6.3'
                  assert int(e['versionCode'])==106003
                  assert e['sources'][0]['language']=='zh'
                  assert int(e['sources'][0]['id'])==4940002032762570168
          except Exception as exc:
              print(exc)
              sys.exit(1)
          PY
            then
              curl -fsSI "$base/$apk?attempt=$attempt" >/dev/null
              curl -fsSI "$base/test/apk/$apk?attempt=$attempt" >/dev/null
              ok=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$ok" = 1
          echo 'Public formal and test stores verified at Dongman Manhua Plus v1.6.3 / 106003 / zh'
