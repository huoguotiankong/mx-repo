name: Promote Bilibili Manga v24 from staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-bilibilimanga-v24-from-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-bilibilimanga-v24-from-staging
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository release branch
        uses: actions/checkout@v5
        with:
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout staged test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and promote only Bilibili Manga v24
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.bilibilimanga'
          expected = ('1.6.24', 106024)
          staged = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          public_path = Path('repo/test/index.json')
          public = json.loads(public_path.read_text('utf-8'))

          staged_items = [x for x in staged['extensionList']['extensions'] if x.get('packageName') == package]
          if len(staged_items) != 1:
              raise SystemExit(f'Expected one staged Bilibili entry, got {len(staged_items)}')
          item = staged_items[0]
          actual = (item.get('versionName'), item.get('versionCode'))
          if actual != expected:
              raise SystemExit(f'Expected staged Bilibili {expected}, got {actual}')

          apk = Path('staging/test/apk/tachiyomi-zh.bilibilimanga-v1.6.24.apk')
          icon = Path('staging/test/icon/eu.kanade.tachiyomi.extension.zh.bilibilimanga-v106024.png')
          if not apk.is_file() or not icon.is_file():
              raise SystemExit('Staged Bilibili v24 APK/icon missing')
          print('staged apk sha256=' + hashlib.sha256(apk.read_bytes()).hexdigest())

          items = public['extensionList']['extensions']
          positions = [i for i, x in enumerate(items) if x.get('packageName') == package]
          if len(positions) > 1:
              raise SystemExit(f'Expected at most one public Bilibili entry, got {len(positions)}')
          if positions:
              items[positions[0]] = item
          else:
              items.append(item)
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY

          rm -f repo/test/apk/tachiyomi-zh.bilibilimanga-v*.apk
          rm -f repo/test/icon/eu.kanade.tachiyomi.extension.zh.bilibilimanga-v*.png
          cp staging/test/apk/tachiyomi-zh.bilibilimanga-v1.6.24.apk repo/test/apk/
          cp staging/test/icon/eu.kanade.tachiyomi.extension.zh.bilibilimanga-v106024.png repo/test/icon/

      - name: Commit public Bilibili v24 test
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/index.json test/apk test/icon
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Bilibili v24 test-store changes'
          else
            git commit -m 'Publish Bilibili Manga v1.6.24 title-fix test'
            git push origin HEAD:repo
          fi

      - name: Verify promoted files locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.bilibilimanga'
          data = json.loads(Path('repo/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          assert (items[0].get('versionName'), items[0].get('versionCode')) == ('1.6.24', 106024)
          assert Path('repo/test/apk/tachiyomi-zh.bilibilimanga-v1.6.24.apk').is_file()
          assert Path('repo/test/icon/eu.kanade.tachiyomi.extension.zh.bilibilimanga-v106024.png').is_file()
          print('Bilibili Manga v1.6.24 local promotion verification passed')
          PY

      - name: Verify public raw test index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          url = 'https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test/index.json'
          package = 'eu.kanade.tachiyomi.extension.zh.bilibilimanga'
          for attempt in range(1, 11):
              try:
                  with urllib.request.urlopen(url + '?v=106024-' + str(attempt), timeout=15) as r:
                      data = json.load(r)
                  items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
                  if len(items) == 1 and (items[0].get('versionName'), items[0].get('versionCode')) == ('1.6.24', 106024):
                      print('Public raw Bilibili v24 verified')
                      raise SystemExit(0)
              except Exception as e:
                  print('attempt', attempt, 'not ready:', e)
              time.sleep(min(attempt, 5))
          raise SystemExit('Public raw Bilibili v24 not visible')
          PY
