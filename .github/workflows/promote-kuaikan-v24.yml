name: Promote Kuaikan v24 handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/promote-kuaikan-v24-trigger"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote validated production handoff
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/production-handoff"
          expected_source="f96b0f4baa6417f00f6e1f405b38090153fc38ff"
          actual_source="$(curl -fsSL "$base/SOURCE_SHA.txt" | tr -d '\r\n')"
          [[ "$actual_source" == "$expected_source" ]] || {
            echo "::error::Production handoff source SHA mismatch: $actual_source"
            exit 1
          }

          files=(
            index-android.json
            index-android.min.json
            index-android.pb
            index.json
            index.min.json
            index.pb
            published-state.json
            tachiyomi-zh.kuaikanmanhua-v1.6.24.apk
            tachiyomi-zh.kuaikanmanhua-v1.6.24.jar
          )
          for file in "${files[@]}"; do
            curl -fsSL "$base/$file" -o "$file"
          done
          mkdir -p icon
          curl -fsSL \
            "$base/icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106024.png" \
            -o "icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106024.png"

          rm -f \
            tachiyomi-zh.kuaikanmanhua-v1.6.22.apk \
            tachiyomi-zh.kuaikanmanhua-v1.6.22.jar \
            icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106022.png

          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = "eu.kanade.tachiyomi.extension.zh.kuaikanmanhua"
          data = json.loads(Path("index.json").read_text(encoding="utf-8"))
          ext = next((x for x in data["extensionList"]["extensions"] if x.get("packageName") == pkg), None)
          if ext is None or ext.get("versionName") != "1.6.24" or int(ext.get("versionCode", -1)) != 106024:
              raise SystemExit(f"Unexpected production index entry: {ext}")

          android = json.loads(Path("index-android.json").read_text(encoding="utf-8"))
          ext_android = next((x for x in android["extensionList"]["extensions"] if x.get("packageName") == pkg), None)
          if ext_android is None or ext_android.get("versionName") != "1.6.24" or int(ext_android.get("versionCode", -1)) != 212024:
              raise SystemExit(f"Unexpected Android compatibility index entry: {ext_android}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "::error::No production changes to publish"
            exit 1
          }
          git commit -m "Publish kuaikanmanhua v1.6.24"
          git push origin HEAD:repo
