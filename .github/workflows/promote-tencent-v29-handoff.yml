name: Promote Tencent Comics v1.4.29 handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-tencent-v29-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-tencent-v29-handoff
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout validated production handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: 7e36d050731c6795731bea268185dc66a9ec40e0
          path: handoff
          fetch-depth: 1
          persist-credentials: false

      - name: Verify handoff is targeted and current
        shell: bash
        run: |
          set -euo pipefail
          src="handoff/production-handoff"
          expected_source="e0771a59d2e93127fa49f97431f2b9f5d24fc2af"
          [[ "$(tr -d '\r\n' < "$src/SOURCE_SHA.txt")" == "$expected_source" ]]

          test -f "$src/tachiyomi-zh.tencentcomics-v1.4.29.apk"
          test -f "$src/tachiyomi-zh.tencentcomics-v1.4.29.jar"
          test -f "$src/icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104029.png"

          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = 'eu.kanade.tachiyomi.extension.zh.tencentcomics'
          current = json.loads(Path('index.json').read_text('utf-8'))
          staged = json.loads(Path('handoff/production-handoff/index.json').read_text('utf-8'))
          cur = {x['packageName']: x for x in current['extensionList']['extensions']}
          new = {x['packageName']: x for x in staged['extensionList']['extensions']}
          assert set(cur) == set(new), (set(cur) - set(new), set(new) - set(cur))
          for name in cur:
              if name != pkg:
                  assert cur[name] == new[name], f'unrelated index entry changed in handoff: {name}'
          item = new[pkg]
          assert item['versionName'] == '1.4.29', item
          assert str(item['versionCode']) == '104029', item

          current_state = json.loads(Path('published-state.json').read_text('utf-8'))
          staged_state = json.loads(Path('handoff/production-handoff/published-state.json').read_text('utf-8'))
          assert set(current_state) == set(staged_state), (set(current_state) - set(staged_state), set(staged_state) - set(current_state))
          for name in current_state:
              if name != pkg:
                  assert current_state[name] == staged_state[name], f'unrelated published-state entry changed: {name}'

          print('Tencent v29 handoff is targeted; all unrelated extension entries are unchanged')
          print('Tencent staged version:', item['versionName'], item['versionCode'])
          PY

      - name: Copy Tencent v29 production payload
        shell: bash
        run: |
          set -euo pipefail
          src="handoff/production-handoff"
          for f in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            cp "$src/$f" "$f"
          done
          cp "$src/tachiyomi-zh.tencentcomics-v1.4.29.apk" .
          cp "$src/tachiyomi-zh.tencentcomics-v1.4.29.jar" .
          mkdir -p icon
          cp "$src/icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104029.png" icon/
          git diff --check

      - name: Commit public repo update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json \
            tachiyomi-zh.tencentcomics-v1.4.29.apk tachiyomi-zh.tencentcomics-v1.4.29.jar \
            icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104029.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Tencent v29 production payload already present"
          else
            git commit -m "Publish Tencent Comics v1.4.29"
            git push origin HEAD:repo
          fi

      - name: Verify public branch contents
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repo
          git show origin/repo:index.json > /tmp/index.json
          git show origin/repo:published-state.json > /tmp/published-state.json
          git cat-file -e origin/repo:tachiyomi-zh.tencentcomics-v1.4.29.apk
          git cat-file -e origin/repo:tachiyomi-zh.tencentcomics-v1.4.29.jar
          git cat-file -e origin/repo:icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104029.png
          python3 - <<'PY'
          import json
          pkg = 'eu.kanade.tachiyomi.extension.zh.tencentcomics'
          data = json.load(open('/tmp/index.json', encoding='utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == pkg)
          assert item['versionName'] == '1.4.29', item
          assert str(item['versionCode']) == '104029', item
          state = json.load(open('/tmp/published-state.json', encoding='utf-8'))
          assert state[pkg]['versionName'] == '1.4.29', state[pkg]
          print('Published Tencent Comics v1.4.29 / 104029 verified on repo branch')
          PY
