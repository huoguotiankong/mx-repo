name: Promote Manwa Plus v1.6.5 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-manwaplus-v165-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-manwaplus-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout formal repository
        uses: actions/checkout@v5
        with:
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout production handoff staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for exact Manwa Plus v1.6.5 handoff
        shell: bash
        run: |
          set -euo pipefail
          target='staging/production-handoff/manwaplus-v1.6.5'
          expected='a67688c33a77f27c5142de64b4dbb7aa1daf818d'
          for attempt in $(seq 1 48); do
            if [[ -f "$target/SOURCE_SHA.txt" ]] && [[ "$(tr -d '\r\n' < "$target/SOURCE_SHA.txt")" == "$expected" ]]; then
              echo "Exact production handoff is ready"
              exit 0
            fi
            echo "Waiting for production handoff ($attempt/48)..."
            sleep 15
            git -C staging fetch --depth=1 origin extension-staging
            git -C staging reset --hard FETCH_HEAD
          done
          echo '::error::Timed out waiting for exact Manwa Plus v1.6.5 production handoff'
          exit 1

      - name: Verify handoff and protect concurrent releases
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff/manwaplus-v1.6.5'
          test "$(tr -d '\r\n' < "$h/SOURCE_SHA.txt")" = 'a67688c33a77f27c5142de64b4dbb7aa1daf818d'
          test -f "$h/tachiyomi-zh.manwaplus-v1.6.5.apk"
          test -f "$h/tachiyomi-zh.manwaplus-v1.6.5.jar"
          test -f "$h/icon/eu.kanade.tachiyomi.extension.zh.manwaplus-v106005.png"
          for file in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            test -f "$h/$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.manwaplus'
          h=Path('staging/production-handoff/manwaplus-v1.6.5')
          def load(path): return json.loads(path.read_text('utf-8'))
          handoff=load(h/'index.json')
          current=load(Path('repo/index.json'))
          hext={x['packageName']:x for x in handoff['extensionList']['extensions']}
          cext={x['packageName']:x for x in current['extensionList']['extensions']}
          assert package in hext
          m=hext[package]
          assert m['versionName']=='1.6.5' and int(m['versionCode'])==106005, m
          assert m['resources']['apkUrl'].endswith('/tachiyomi-zh.manwaplus-v1.6.5.apk'), m
          assert m['resources']['jarUrl'].endswith('/tachiyomi-zh.manwaplus-v1.6.5.jar'), m
          assert m['resources']['iconUrl'].endswith('/icon/eu.kanade.tachiyomi.extension.zh.manwaplus-v106005.png'), m
          hs=dict(hext); hs.pop(package, None)
          cs=dict(cext); cs.pop(package, None)
          if hs != cs:
              raise SystemExit('Formal repository changed after handoff generation; refusing to overwrite another release')
          android=load(h/'index-android.json')
          am=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(am)==1 and int(am[0]['versionCode'])==212005, am
          hstate=load(h/'published-state.json')
          cstate=load(Path('repo/published-state.json'))
          assert hstate[package]['versionName']=='1.6.5', hstate[package]
          assert int(hstate[package]['versionCode'])==106005, hstate[package]
          assert int(hstate[package]['androidVersionCode'])==212005, hstate[package]
          hs_state=dict(hstate); hs_state.pop(package, None)
          cs_state=dict(cstate); cs_state.pop(package, None)
          if hs_state != cs_state:
              raise SystemExit('Published state changed after handoff generation; refusing to overwrite another release')
          print('Handoff verified and concurrent-release guard passed')
          PY

      - name: Apply formal Manwa Plus v1.6.5 handoff
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff/manwaplus-v1.6.5'
          rm -f repo/tachiyomi-zh.manwaplus-v*.apk repo/tachiyomi-zh.manwaplus-v*.jar
          rm -f repo/icon/eu.kanade.tachiyomi.extension.zh.manwaplus-v*.png
          while IFS= read -r -d '' file; do
            rel="${file#$h/}"
            [[ "$rel" == 'SOURCE_SHA.txt' ]] && continue
            mkdir -p "repo/$(dirname "$rel")"
            cp -a "$file" "repo/$rel"
          done < <(find "$h" -type f -print0)

      - name: Verify formal repository before push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.manwaplus'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.5' and int(m[0]['versionCode'])==106005, m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212005, a
          state=json.loads(Path('repo/published-state.json').read_text('utf-8'))
          assert state[package]['versionName']=='1.6.5', state[package]
          assert Path('repo/tachiyomi-zh.manwaplus-v1.6.5.apk').is_file()
          assert Path('repo/tachiyomi-zh.manwaplus-v1.6.5.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.manwaplus-v106005.png').is_file()
          print('Formal Manwa Plus v1.6.5 snapshot verified before push')
          PY
          git -C repo add -A
          git -C repo diff --cached --check

      - name: Commit and push formal plugin store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Manwa Plus v1.6.5 is already published'
          else
            git commit -m 'Publish Manwa Plus v1.6.5'
            git pull --rebase origin repo
            git push origin HEAD:repo
          fi

      - name: Verify pushed formal plugin store
        shell: bash
        run: |
          set -euo pipefail
          git -C repo fetch origin repo
          git -C repo reset --hard origin/repo
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.manwaplus'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.5' and int(m[0]['versionCode'])==106005, m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212005, a
          assert Path('repo/index.pb').is_file()
          assert Path('repo/tachiyomi-zh.manwaplus-v1.6.5.apk').is_file()
          assert Path('repo/tachiyomi-zh.manwaplus-v1.6.5.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.manwaplus-v106005.png').is_file()
          print('Formal Manwa Plus v1.6.5 plugin-store push verified')
          PY
