name: Promote Meirentu v1.6.1 test from staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-meirentu-v161-test-from-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-meirentu-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch pinned staged Meirentu v1.6.1
        shell: bash
        run: |
          set -euo pipefail
          staging_sha='21af6529886783e182041e6d08c99b222f7dfddb'
          base="https://raw.githubusercontent.com/huoguotiankong/mx-build/$staging_sha/test"
          curl -fsSL --retry 3 "$base/index.json" -o /tmp/staged-index.json
          curl -fsSL --retry 3 "$base/apk/tachiyomi-zh.meirentu-v1.6.1.apk" -o /tmp/meirentu.apk
          curl -fsSL --retry 3 "$base/icon/eu.kanade.tachiyomi.extension.zh.meirentu-v106001.png" -o /tmp/meirentu.png
          test -s /tmp/meirentu.apk
          test -s /tmp/meirentu.png
          sha256sum /tmp/meirentu.apk | tee /tmp/meirentu.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.meirentu'
          staged = json.loads(Path('/tmp/staged-index.json').read_text('utf-8'))
          items = [x for x in staged['extensionList']['extensions'] if x.get('packageName') == package]
          if len(items) != 1:
              raise SystemExit(f'Expected one staged Meirentu item, got {len(items)}')
          item = items[0]
          if (item.get('versionName'), item.get('versionCode')) != ('1.6.1', 106001):
              raise SystemExit(f'Unexpected staged Meirentu version: {(item.get("versionName"), item.get("versionCode"))}')
          if item.get('extensionLib') != '1.6':
              raise SystemExit(f'Unexpected extensionLib: {item.get("extensionLib")}')
          sources = item.get('sources') or []
          if len(sources) != 1 or sources[0].get('name') != '美人图':
              raise SystemExit('Unexpected staged Meirentu source metadata')
          if sources[0].get('homeUrl') != 'https://meirentu.cc':
              raise SystemExit(f'Unexpected Meirentu homeUrl: {sources[0].get("homeUrl")}')
          Path('/tmp/meirentu-entry.json').write_text(json.dumps(item, ensure_ascii=False), encoding='utf-8')
          PY

      - name: Promote only Meirentu v1.6.1 to test store
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.meirentu'
          public_path = Path('test/index.json')
          public = json.loads(public_path.read_text('utf-8'))
          staged_item = json.loads(Path('/tmp/meirentu-entry.json').read_text('utf-8'))
          items = public['extensionList']['extensions']
          positions = [i for i, x in enumerate(items) if x.get('packageName') == package]
          if len(positions) > 1:
              raise SystemExit(f'Expected at most one public Meirentu item, got {len(positions)}')
          if positions:
              items[positions[0]] = staged_item
          else:
              items.append(staged_item)
          items.sort(key=lambda x: (str(x.get('name', '')).casefold(), str(x.get('packageName', ''))))
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f test/apk/tachiyomi-zh.meirentu-v*.apk
          rm -f test/icon/eu.kanade.tachiyomi.extension.zh.meirentu-v*.png
          cp /tmp/meirentu.apk test/apk/tachiyomi-zh.meirentu-v1.6.1.apk
          cp /tmp/meirentu.png test/icon/eu.kanade.tachiyomi.extension.zh.meirentu-v106001.png
          git status --short

      - name: Commit and push Meirentu v1.6.1 test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/index.json test/apk test/icon
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No Meirentu test-store changes to publish'
          else
            git commit -m 'Publish Meirentu v1.6.1 test'
            git push origin HEAD:repo
          fi

      - name: Verify published files locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.meirentu'
          data = json.loads(Path('test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.1', 106001)
          assert item.get('extensionLib') == '1.6'
          source = (item.get('sources') or [{}])[0]
          assert source.get('name') == '美人图'
          assert source.get('homeUrl') == 'https://meirentu.cc'
          apk = Path('test/apk/tachiyomi-zh.meirentu-v1.6.1.apk')
          icon = Path('test/icon/eu.kanade.tachiyomi.extension.zh.meirentu-v106001.png')
          assert apk.is_file() and icon.is_file()
          staged_hash = Path('/tmp/meirentu.sha256').read_text().split()[0]
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == staged_hash
          print('Meirentu v1.6.1 local test promotion verified:', staged_hash)
          PY

      - name: Verify public raw test store
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test'
          for file in index.json apk/tachiyomi-zh.meirentu-v1.6.1.apk icon/eu.kanade.tachiyomi.extension.zh.meirentu-v106001.png; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -L -sS -o "/tmp/$(basename "$file")" -w '%{http_code}' "$base/$file" || true)"
              if [[ "$status" == '200' ]]; then ok=1; break; fi
              sleep $((attempt * 2))
            done
            [[ "$ok" -eq 1 ]] || { echo "::error::Published endpoint unavailable: $file"; exit 1; }
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.meirentu'
          data = json.loads(Path('/tmp/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.1', 106001)
          source = (item.get('sources') or [{}])[0]
          assert source.get('name') == '美人图'
          assert source.get('homeUrl') == 'https://meirentu.cc'
          print('Public Meirentu v1.6.1 test index verified')
          PY
