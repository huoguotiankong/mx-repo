name: Publish Kuaikan v26 Production Handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-kuaikan-v25-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kuaikan-v26-production-handoff
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validated Kuaikan production handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: handoff
          persist-credentials: false

      - name: Checkout distribution repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          path: dist
          fetch-depth: 0

      - name: Verify and stage Kuaikan v26 payload
        shell: bash
        run: |
          set -euo pipefail
          payload="handoff/production-handoff"
          expected_sha="3cf9b769b4d2574b7740db498e54dd915aad325f"
          [[ "$(tr -d '\r\n' < "$payload/SOURCE_SHA.txt")" == "$expected_sha" ]] || {
            echo "::error::Production handoff source SHA is not Kuaikan v26"
            exit 1
          }
          test -f "$payload/tachiyomi-zh.kuaikanmanhua-v1.6.26.apk"
          test -f "$payload/tachiyomi-zh.kuaikanmanhua-v1.6.26.jar"
          test -f "$payload/icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106026.png"
          grep -q 'eu.kanade.tachiyomi.extension.zh.kuaikanmanhua' "$payload/index.json"
          grep -q '1.6.26' "$payload/index.json"
          grep -q '106026' "$payload/index.json"

          cp "$payload/index.json" dist/index.json
          cp "$payload/index.min.json" dist/index.min.json
          cp "$payload/index.pb" dist/index.pb
          cp "$payload/index-android.json" dist/index-android.json
          cp "$payload/index-android.min.json" dist/index-android.min.json
          cp "$payload/index-android.pb" dist/index-android.pb
          cp "$payload/published-state.json" dist/published-state.json
          mkdir -p dist/icon
          cp "$payload/icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106026.png" dist/icon/
          cp "$payload/tachiyomi-zh.kuaikanmanhua-v1.6.26.apk" dist/
          cp "$payload/tachiyomi-zh.kuaikanmanhua-v1.6.26.jar" dist/
          rm -f dist/tachiyomi-zh.kuaikanmanhua-v1.6.25.apk
          rm -f dist/tachiyomi-zh.kuaikanmanhua-v1.6.25.jar
          rm -f dist/icon/eu.kanade.tachiyomi.extension.zh.kuaikanmanhua-v106025.png

      - name: Commit production repository
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Kuaikan v26 is already published"
          else
            git commit -m "Publish Kuaikan Manhua v26"
            git pull --rebase origin repo
            git push origin HEAD:repo
          fi

      - name: Verify public Kuaikan v26
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL "$base/index.json?attempt=$attempt" -o /tmp/index.json || true
            if grep -q 'eu.kanade.tachiyomi.extension.zh.kuaikanmanhua' /tmp/index.json 2>/dev/null && \
               grep -q '1.6.26' /tmp/index.json 2>/dev/null && \
               grep -q '106026' /tmp/index.json 2>/dev/null; then
              curl -fsSI "$base/tachiyomi-zh.kuaikanmanhua-v1.6.26.apk" >/dev/null
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Kuaikan v26 public endpoints did not converge"
          exit 1
