name: Promote MX Extension Test Store

on:
  push:
    branches: [main]
    paths:
      - ".github/test-store-promote-trigger"

permissions:
  contents: write

concurrency:
  group: promote-mx-extension-test-store
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout promotion trigger
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve expected target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_name="$(sed -n 's/^source=//p' .github/test-store-promote-trigger | head -n 1)"
          expected_version="$(sed -n 's/^expected_version=//p' .github/test-store-promote-trigger | head -n 1)"
          [[ "$source_name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo "::error::Invalid source module"; exit 1; }
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version"; exit 1; }
          echo "source=$source_name" >> "$GITHUB_OUTPUT"
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"

      - name: Checkout verified public staging store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged package and APK
        shell: bash
        env:
          SOURCE_NAME: ${{ steps.target.outputs.source }}
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("staging/test/index.json").read_text("utf-8"))
          package = "eu.kanade.tachiyomi.extension.zh." + os.environ["SOURCE_NAME"]
          items = [x for x in data["extensionList"]["extensions"] if x.get("packageName") == package]
          if len(items) != 1:
              raise SystemExit(f"Expected one staged {package}, got {len(items)}")
          item = items[0]
          version = item.get("versionName")
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Staged version mismatch: expected {os.environ['EXPECTED_VERSION']}, got {version}")
          apk_name = item.get("resources", {}).get("apkUrl", "").rsplit("/", 1)[-1]
          apk_path = Path("staging/test/apk") / apk_name
          if not apk_name or not apk_path.is_file():
              raise SystemExit(f"Staged APK missing: {apk_name}")
          print(f"Verified staged {package} {version} versionCode={item.get('versionCode')} apk={apk_name}")
          PY

      - name: Checkout distribution branch
        uses: actions/checkout@v5
        with:
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote verified test snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repo/test
          mkdir -p repo/test
          cp -a staging/test/. repo/test/

      - name: Commit test store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          if git diff --cached --quiet; then
            echo "No test-store changes to publish"
          else
            git commit -m "Publish ${{ steps.target.outputs.source }} v${{ steps.target.outputs.version }} test store"
            git push origin HEAD:repo
          fi

      - name: Verify public test store
        shell: bash
        env:
          SOURCE_NAME: ${{ steps.target.outputs.source }}
          EXPECTED_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test"
          for file in repo.json index.json; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -L -sS -o "/tmp/$file" -w '%{http_code}' "$base/$file" || true)"
              if [[ "$status" == "200" ]]; then ok=1; break; fi
              sleep $((attempt * 2))
            done
            [[ "$ok" -eq 1 ]] || { echo "::error::Published endpoint unavailable: $file"; exit 1; }
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("/tmp/index.json").read_text("utf-8"))
          package = "eu.kanade.tachiyomi.extension.zh." + os.environ["SOURCE_NAME"]
          items = [x for x in data["extensionList"]["extensions"] if x.get("packageName") == package]
          if len(items) != 1:
              raise SystemExit(f"Expected one published {package}, got {len(items)}")
          item = items[0]
          version = item.get("versionName")
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Published version mismatch: expected {os.environ['EXPECTED_VERSION']}, got {version}")
          print(f"Published {package} versionName={version} versionCode={item.get('versionCode')}")
          PY
