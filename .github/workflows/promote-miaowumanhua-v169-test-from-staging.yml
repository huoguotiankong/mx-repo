name: Promote Miaowu v1.6.9 test from staging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-miaowumanhua-v169-test-from-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-miaowumanhua-v169-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch pinned staged Miaowu v1.6.9
        shell: bash
        run: |
          set -euo pipefail
          staging_sha='a3be0acaab79a9fbf415744a19bf5468afcf47d5'
          base="https://raw.githubusercontent.com/huoguotiankong/mx-build/$staging_sha/test"
          curl -fsSL --retry 3 "$base/index.json" -o /tmp/staged-index.json
          curl -fsSL --retry 3 "$base/apk/tachiyomi-zh.miaowumanhua-v1.6.9.apk" -o /tmp/miaowumanhua.apk
          curl -fsSL --retry 3 "$base/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106009.png" -o /tmp/miaowumanhua.png
          test -s /tmp/miaowumanhua.apk
          test -s /tmp/miaowumanhua.png
          sha256sum /tmp/miaowumanhua.apk | tee /tmp/miaowumanhua.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          staged = json.loads(Path('/tmp/staged-index.json').read_text('utf-8'))
          items = [x for x in staged['extensionList']['extensions'] if x.get('packageName') == package]
          if len(items) != 1:
              raise SystemExit(f'Expected one staged Miaowu item, got {len(items)}')
          item = items[0]
          if (item.get('versionName'), item.get('versionCode')) != ('1.6.9', 106009):
              raise SystemExit(f'Unexpected staged Miaowu version: {(item.get("versionName"), item.get("versionCode"))}')
          if item.get('extensionLib') != '1.6':
              raise SystemExit(f'Unexpected extensionLib: {item.get("extensionLib")}')
          sources = item.get('sources') or []
          if len(sources) != 1 or sources[0].get('name') != '喵呜漫画':
              raise SystemExit('Unexpected staged Miaowu source metadata')
          if sources[0].get('id') != 2052748012150712956:
              raise SystemExit(f'Unexpected Miaowu source id: {sources[0].get("id")}')
          if sources[0].get('homeUrl') != 'https://maowu.iqtao.cn':
              raise SystemExit(f'Unexpected Miaowu homeUrl: {sources[0].get("homeUrl")}')
          Path('/tmp/miaowumanhua-entry.json').write_text(
              json.dumps(item, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Promote only Miaowu v1.6.9 to test store
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          public_path = Path('test/index.json')
          public = json.loads(public_path.read_text('utf-8'))
          staged_item = json.loads(Path('/tmp/miaowumanhua-entry.json').read_text('utf-8'))
          items = public['extensionList']['extensions']
          positions = [i for i, x in enumerate(items) if x.get('packageName') == package]
          if len(positions) > 1:
              raise SystemExit(f'Expected at most one public Miaowu item, got {len(positions)}')
          if positions:
              items[positions[0]] = staged_item
          else:
              items.append(staged_item)
          items.sort(key=lambda x: (str(x.get('name', '')).casefold(), str(x.get('packageName', ''))))
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f test/apk/tachiyomi-zh.miaowumanhua-v*.apk
          rm -f test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v*.png
          cp /tmp/miaowumanhua.apk test/apk/tachiyomi-zh.miaowumanhua-v1.6.9.apk
          cp /tmp/miaowumanhua.png test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106009.png
          git status --short

      - name: Verify targeted diff
        shell: bash
        run: |
          set -euo pipefail
          git add test/index.json test/apk test/icon
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              test/index.json|test/apk/tachiyomi-zh.miaowumanhua-v*.apk|test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v*.png) ;;
              *) echo "::error::Unexpected staged path: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit and push Miaowu v1.6.9 test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No Miaowu test-store changes to publish'
          else
            git commit -m 'Publish Miaowu v1.6.9 APP-only test'
            git push origin HEAD:repo
          fi

      - name: Verify published files locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          data = json.loads(Path('test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.9', 106009)
          assert item.get('extensionLib') == '1.6'
          source = (item.get('sources') or [{}])[0]
          assert source.get('name') == '喵呜漫画'
          assert source.get('id') == 2052748012150712956
          assert source.get('homeUrl') == 'https://maowu.iqtao.cn'
          apk = Path('test/apk/tachiyomi-zh.miaowumanhua-v1.6.9.apk')
          icon = Path('test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106009.png')
          assert apk.is_file() and icon.is_file()
          staged_hash = Path('/tmp/miaowumanhua.sha256').read_text().split()[0]
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == staged_hash
          print('Miaowu v1.6.9 local test promotion verified:', staged_hash)
          PY

      - name: Verify public test endpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test'
          ok=0
          for n in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/public-index.json -w '%{http_code}' "$base/index.json?ts=$(date +%s%N)" || true)"
            if [[ "$code" == '200' ]]; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/public-index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == 'eu.kanade.tachiyomi.extension.zh.miaowumanhua')
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.9', 106009), item
          PY
              then ok=1; break; fi
            fi
            sleep $((n * 2))
          done
          [[ "$ok" -eq 1 ]] || { echo '::error::Public MX Test index did not converge to Miaowu v1.6.9'; exit 1; }
          curl -fL -sS "$base/apk/tachiyomi-zh.miaowumanhua-v1.6.9.apk?ts=$(date +%s%N)" -o /tmp/public-miaowu.apk
          test -s /tmp/public-miaowu.apk
          expected="$(cut -d' ' -f1 /tmp/miaowumanhua.sha256)"
          actual="$(sha256sum /tmp/public-miaowu.apk | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo '::error::Public APK hash mismatch'; exit 1; }
          echo 'Public Miaowu v1.6.9 test verified online'
