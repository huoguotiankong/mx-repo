name: Promote KManhua v1.6.1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-kmanhua-v161-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-kmanhua-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout formal repository
        uses: actions/checkout@v5
        with:
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact formal base
        shell: bash
        run: |
          set -euo pipefail
          expected='9cae15567fc72dfaaaa680c9a42cad0a2c5d6b1a'
          actual="$(git -C repo rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Formal repo moved since KManhua handoff generation: $actual"
            exit 1
          }

      - name: Checkout pinned KManhua production handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: 48e2ae6ce54abeb38282bbe4db6a98532526c2c8
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify KManhua handoff and concurrent-release guard
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff'
          test "$(tr -d '\r\n' < "$h/SOURCE_SHA.txt")" = 'f6f5b81dd7cf5c8cedeb1934fcce582a8d2e9227'
          test -f "$h/tachiyomi-zh.kmanhua-v1.6.1.apk"
          test -f "$h/tachiyomi-zh.kmanhua-v1.6.1.jar"
          test -f "$h/icon/eu.kanade.tachiyomi.extension.zh.kmanhua-v106001.png"
          for file in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            test -f "$h/$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.kmanhua'
          h=Path('staging/production-handoff')
          def load(path): return json.loads(path.read_text('utf-8'))
          handoff=load(h/'index.json')
          current=load(Path('repo/index.json'))
          hext={x['packageName']:x for x in handoff['extensionList']['extensions']}
          cext={x['packageName']:x for x in current['extensionList']['extensions']}
          assert package in hext
          m=hext[package]
          assert m['versionName']=='1.6.1' and int(m['versionCode'])==106001, m
          assert (m.get('sources') or [{}])[0].get('name')=='K漫画', m
          assert (m.get('sources') or [{}])[0].get('homeUrl')=='https://kmh010.net', m
          assert m['resources']['apkUrl'].endswith('/tachiyomi-zh.kmanhua-v1.6.1.apk'), m
          assert m['resources']['jarUrl'].endswith('/tachiyomi-zh.kmanhua-v1.6.1.jar'), m
          assert m['resources']['iconUrl'].endswith('/icon/eu.kanade.tachiyomi.extension.zh.kmanhua-v106001.png'), m
          hs=dict(hext); hs.pop(package, None)
          cs=dict(cext); cs.pop(package, None)
          if hs != cs:
              raise SystemExit('Formal index changed outside KManhua; refusing promotion')
          android=load(h/'index-android.json')
          am=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(am)==1 and int(am[0]['versionCode'])==212001, am
          hstate=load(h/'published-state.json')
          cstate=load(Path('repo/published-state.json'))
          assert hstate[package]['versionName']=='1.6.1', hstate[package]
          assert int(hstate[package]['versionCode'])==106001, hstate[package]
          assert int(hstate[package]['androidVersionCode'])==212001, hstate[package]
          hs_state=dict(hstate); hs_state.pop(package, None)
          cs_state=dict(cstate); cs_state.pop(package, None)
          if hs_state != cs_state:
              raise SystemExit('Published state changed outside KManhua; refusing promotion')
          print('KManhua production handoff verified')
          PY

      - name: Apply KManhua production handoff
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff'
          rm -f repo/tachiyomi-zh.kmanhua-v*.apk repo/tachiyomi-zh.kmanhua-v*.jar
          rm -f repo/icon/eu.kanade.tachiyomi.extension.zh.kmanhua-v*.png
          while IFS= read -r -d '' file; do
            rel="${file#$h/}"
            [[ "$rel" == 'SOURCE_SHA.txt' ]] && continue
            mkdir -p "repo/$(dirname "$rel")"
            cp -a "$file" "repo/$rel"
          done < <(find "$h" -type f -print0)

      - name: Verify formal snapshot before push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.kmanhua'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.1' and int(m[0]['versionCode'])==106001, m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212001, a
          state=json.loads(Path('repo/published-state.json').read_text('utf-8'))
          assert int(state[package]['versionCode'])==106001
          assert int(state[package]['androidVersionCode'])==212001
          assert Path('repo/tachiyomi-zh.kmanhua-v1.6.1.apk').is_file()
          assert Path('repo/tachiyomi-zh.kmanhua-v1.6.1.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.kmanhua-v106001.png').is_file()
          print('KManhua formal snapshot verified before push')
          PY
          git -C repo add -A
          git -C repo diff --cached --check

      - name: Commit and push formal plugin store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'KManhua v1.6.1 is already published'
          else
            git commit -m 'Publish KManhua v1.6.1'
            git push origin HEAD:repo
          fi

      - name: Verify pushed formal plugin store
        shell: bash
        run: |
          set -euo pipefail
          git -C repo fetch origin repo
          git -C repo reset --hard origin/repo
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.kmanhua'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.1' and int(m[0]['versionCode'])==106001, m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212001, a
          assert Path('repo/index.pb').is_file()
          assert Path('repo/tachiyomi-zh.kmanhua-v1.6.1.apk').is_file()
          assert Path('repo/tachiyomi-zh.kmanhua-v1.6.1.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.kmanhua-v106001.png').is_file()
          print('KManhua formal plugin-store push verified')
          PY
