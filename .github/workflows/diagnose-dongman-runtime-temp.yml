name: Diagnose Dongman runtime temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dongman-runtime-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect reader payload and comment replies
        shell: bash
        run: |
          set -u
          U='https://m.dongmanmanhua.cn/FANTASY/fanzhuanlianxisheng/%E7%AC%AC1%E8%AF%9D-%E6%98%A8%E5%A4%A9%E7%9A%84%E6%88%91%E6%98%AF%E9%87%91%E4%B8%8A%E6%B3%AB1/viewer?title_no=2795&episode_no=1'
          curl -LfsS --compressed -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' "$U" -o /tmp/v.html
          python3 - <<'PY'
          import re
          t=open('/tmp/v.html',encoding='utf-8',errors='replace').read()
          i=t.find('var imageList')
          print('imageList_offset',i)
          print(t[i:i+12000])
          for needle in ['initViewerBestComment','commentListType','DM.Comment.init']:
              p=t.find(needle)
              print('\n====',needle,p,'====')
              print(t[max(0,p-2500):p+5000])
          PY

          H=(-H 'Accept: application/json' -H 'Accept-Language: zh-CN,zh;q=0.9' -H 'User-Agent: Dongman/Android')
          B='https://apis.dongmanmanhua.cn'
          C='686baa25710d7080fe250f28'
          for U2 in \
            "$B/v1/comment_reply/$C?pageNo=1&pageSize=20" \
            "$B/v1/comment/$C" \
            "$B/v1/comment_reply?commentId=$C&pageNo=1&pageSize=20"; do
            echo "===== $U2 ====="
            curl -sS -L --compressed "${H[@]}" -w '\nHTTP=%{http_code}\n' "$U2" | head -c 12000 || true
            echo
          done
