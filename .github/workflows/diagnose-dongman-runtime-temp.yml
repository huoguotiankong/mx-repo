name: Diagnose Dongman runtime temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dongman-runtime-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe free reader HTML and App APIs
        shell: bash
        run: |
          set -u
          U='https://m.dongmanmanhua.cn/FANTASY/fanzhuanlianxisheng/%E7%AC%AC1%E8%AF%9D-%E6%98%A8%E5%A4%A9%E7%9A%84%E6%88%91%E6%98%AF%E9%87%91%E4%B8%8A%E6%B3%AB1/viewer?title_no=2795&episode_no=1'
          echo '===== READER ====='
          curl -LfsS --compressed -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' "$U" -o /tmp/v.html || true
          wc -c /tmp/v.html || true
          echo '-- img tags --'
          grep -oE '<img[^>]+>' /tmp/v.html | head -n 120 || true
          echo '-- reader literals --'
          grep -oEi '.{0,100}(_imageList|imageList|imageUrl|viewer|comment|episodeInfo).{0,220}' /tmp/v.html | head -n 240 || true
          echo '-- scripts --'
          grep -oE '<script[^>]+src="[^"]+"' /tmp/v.html | head -n 120 || true

          H=(-H 'Accept: application/json' -H 'Accept-Language: zh-CN,zh;q=0.9' -H 'User-Agent: Dongman/Android')
          getp() { echo "===== $1 ====="; curl -sS -L --compressed "${H[@]}" -w '\nHTTP=%{http_code}\n' "$2" | head -c 9000; echo; }
          postp() { echo "===== $1 ====="; curl -sS -L --compressed "${H[@]}" -H "Content-Type: $3" --data "$4" -w '\nHTTP=%{http_code}\n' "$2" | head -c 9000; echo; }
          B='https://apis.dongmanmanhua.cn'
          getp 'EPISODE GET CAMEL' "$B/app/episode/info/v5?titleNo=2795&episodeNo=1"
          getp 'EPISODE GET SNAKE' "$B/app/episode/info/v5?title_no=2795&episode_no=1"
          postp 'EPISODE POST JSON' "$B/app/episode/info/v5" 'application/json; charset=utf-8' '{"titleNo":2795,"episodeNo":1}'
          postp 'EPISODE POST FORM' "$B/app/episode/info/v5" 'application/x-www-form-urlencoded' 'titleNo=2795&episodeNo=1'
          getp 'COMMENT V2 GET' "$B/v2/comment?titleNo=2795&episodeNo=1&pageNo=1&pageSize=20"
          postp 'COMMENT V2 POST JSON' "$B/v2/comment" 'application/json; charset=utf-8' '{"titleNo":2795,"episodeNo":1,"pageNo":1,"pageSize":20}'
          postp 'COMMENT V2 POST FORM' "$B/v2/comment" 'application/x-www-form-urlencoded' 'titleNo=2795&episodeNo=1&pageNo=1&pageSize=20'
          getp 'COMMENT INFO GET' "$B/app/comment/titleEpisodeInfo2?titleNo=2795&episodeNo=1"
          postp 'COMMENT INFO POST JSON' "$B/app/comment/titleEpisodeInfo2" 'application/json; charset=utf-8' '{"titleNo":2795,"episodeNo":1}'
          postp 'COMMENT INFO POST FORM' "$B/app/comment/titleEpisodeInfo2" 'application/x-www-form-urlencoded' 'titleNo=2795&episodeNo=1'
