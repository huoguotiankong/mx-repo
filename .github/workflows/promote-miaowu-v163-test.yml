name: Promote Miaowu v1.6.3 MX Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-miaowu-v163-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-miaowu-v163-mx-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Download verified Miaowu v1.6.3 staging files
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/test'
          curl -fL -sS "$base/index.json?ts=$(date +%s%N)" -o /tmp/staging-index.json
          curl -fL -sS "$base/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk?ts=$(date +%s%N)" -o /tmp/miaowu-v163.apk
          curl -fL -sS "$base/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106003.png?ts=$(date +%s%N)" -o /tmp/miaowu-v163.png
          test -s /tmp/miaowu-v163.apk
          test -s /tmp/miaowu-v163.png

      - name: Merge only Miaowu v1.6.3 into MX Test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          staged = json.loads(Path('/tmp/staging-index.json').read_text('utf-8'))
          public_path = Path('test/index.json')
          public = json.loads(public_path.read_text('utf-8'))

          staged_item = next(x for x in staged['extensionList']['extensions'] if x.get('packageName') == package)
          actual = (staged_item.get('versionName'), staged_item.get('versionCode'))
          if actual != ('1.6.3', 106003):
              raise SystemExit(f'Unexpected staged Miaowu version: {actual}')

          extensions = public['extensionList']['extensions']
          matches = [i for i, x in enumerate(extensions) if x.get('packageName') == package]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one public Miaowu entry, found {len(matches)}')
          extensions[matches[0]] = staged_item
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          apk_dst = Path('test/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk')
          icon_dst = Path('test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106003.png')
          apk_dst.parent.mkdir(parents=True, exist_ok=True)
          icon_dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('/tmp/miaowu-v163.apk', apk_dst)
          shutil.copy2('/tmp/miaowu-v163.png', icon_dst)
          print('Miaowu v1.6.3 merged; other MX Test entries preserved')
          PY

      - name: Verify targeted result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          data = json.loads(Path('test/index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == package)
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.3', 106003), item
          assert Path('test/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk').is_file()
          assert Path('test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106003.png').is_file()
          assert len(data['extensionList']['extensions']) >= 10
          print('Local MX Test verification passed')
          PY
          git add test/index.json \
            test/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk \
            test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106003.png
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              test/index.json|test/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk|test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106003.png) ;;
              *) echo "::error::Unexpected staged path: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Publish MX Test update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Miaowu v1.6.3 APP API test'
            git push origin HEAD:repo
          fi

      - name: Verify public MX Test online
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test'
          ok=0
          for n in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/public-index.json -w '%{http_code}' "$base/index.json?ts=$(date +%s%N)" || true)"
            if [[ "$code" == '200' ]]; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/public-index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == 'eu.kanade.tachiyomi.extension.zh.miaowumanhua')
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.3', 106003), item
          PY
              then ok=1; break; fi
            fi
            sleep $((n * 2))
          done
          [[ "$ok" -eq 1 ]] || { echo '::error::Public MX Test index did not converge to Miaowu v1.6.3'; exit 1; }
          curl -fL -sS "$base/apk/tachiyomi-zh.miaowumanhua-v1.6.3.apk?ts=$(date +%s%N)" -o /tmp/public-miaowu-v163.apk
          test -s /tmp/public-miaowu-v163.apk
          echo 'Public Miaowu v1.6.3 MX Test verified online'
