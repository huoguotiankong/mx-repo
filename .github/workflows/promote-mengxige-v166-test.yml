name: Promote MengXiGe v1.6.6 test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-mengxige-v166-test.yml"

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'ci: promote MengXiGe v1.6.6 test'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staged test snapshot
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: 8e4d0e82fb8196f12622328e4329ba1e5d4e1e77
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged MengXiGe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          pkg = 'eu.kanade.tachiyomi.extension.zh.mengxige'
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == pkg]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.6', 106006)
          PY
          test -f staging/test/apk/tachiyomi-zh.mengxige-v1.6.6.apk
          test -f staging/test/icon/eu.kanade.tachiyomi.extension.zh.mengxige-v106006.png

      - name: Checkout MX public repo branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          token: ${{ github.token }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote MengXiGe only
        shell: bash
        run: |
          set -euo pipefail
          rm -f repo/test/apk/tachiyomi-zh.mengxige-v*.apk
          rm -f repo/test/icon/eu.kanade.tachiyomi.extension.zh.mengxige-v*.png
          cp staging/test/apk/tachiyomi-zh.mengxige-v1.6.6.apk repo/test/apk/
          cp staging/test/icon/eu.kanade.tachiyomi.extension.zh.mengxige-v106006.png repo/test/icon/
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = 'eu.kanade.tachiyomi.extension.zh.mengxige'
          public_path = Path('repo/test/index.json')
          staged_path = Path('staging/test/index.json')
          public = json.loads(public_path.read_text('utf-8'))
          staged = json.loads(staged_path.read_text('utf-8'))
          staged_item = next(x for x in staged['extensionList']['extensions'] if x.get('packageName') == pkg)
          items = public['extensionList']['extensions']
          for i, item in enumerate(items):
              if item.get('packageName') == pkg:
                  items[i] = staged_item
                  break
          else:
              items.append(staged_item)
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY

      - name: Commit public test update
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/index.json test/apk test/icon
          git diff --cached --check
          git commit -m "Publish MengXiGe v1.6.6 test"
          git push origin HEAD:repo

      - name: Verify promoted state locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = 'eu.kanade.tachiyomi.extension.zh.mengxige'
          data = json.loads(Path('repo/test/index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == pkg)
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.6', 106006)
          assert item['resources']['apkUrl'].endswith('tachiyomi-zh.mengxige-v1.6.6.apk')
          assert item['resources']['iconUrl'].endswith('eu.kanade.tachiyomi.extension.zh.mengxige-v106006.png')
          PY
