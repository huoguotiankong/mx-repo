name: Promote Cyppt v1.6.1 production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-cyppt-v161-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mx-repo-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout formal repository
        uses: actions/checkout@v5
        with:
          ref: repo
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact formal base
        shell: bash
        run: |
          set -euo pipefail
          expected='654aa4d6c7ed1db8cd2ba80e06f6b0b97501f1b6'
          actual="$(git -C repo rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Formal repo moved since Cyppt handoff generation: $actual"
            exit 1
          }

      - name: Checkout pinned Cyppt production handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: bc2b20bbf88b583fad7935391b077a7a23f6a049
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Cyppt handoff and concurrent-release guard
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff'
          package='eu.kanade.tachiyomi.extension.zh.cyppt'
          test "$(tr -d '\r\n' < "$h/SOURCE_SHA.txt")" = 'cccc585c1d31f2f30c4a9c9813308cfd46b549d9'
          test -f "$h/tachiyomi-zh.cyppt-v1.6.1.apk"
          test -f "$h/tachiyomi-zh.cyppt-v1.6.1.jar"
          test -f "$h/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v106001.png"
          for file in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            test -f "$h/$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          package='eu.kanade.tachiyomi.extension.zh.cyppt'
          h=Path('staging/production-handoff')
          r=Path('repo')

          def load(path):
              return json.loads(path.read_text('utf-8'))

          handoff=load(h/'index.json')
          current=load(r/'index.json')
          hext={x['packageName']:x for x in handoff['extensionList']['extensions']}
          cext={x['packageName']:x for x in current['extensionList']['extensions']}
          assert package in hext
          m=hext[package]
          assert m['versionName']=='1.6.1' and int(m['versionCode'])==106001, m
          assert (m.get('sources') or [{}])[0].get('name')=='超越漫画网', m
          assert (m.get('sources') or [{}])[0].get('homeUrl')=='https://www.cyppt.com', m
          assert m['resources']['apkUrl'].endswith('/tachiyomi-zh.cyppt-v1.6.1.apk'), m
          assert m['resources']['jarUrl'].endswith('/tachiyomi-zh.cyppt-v1.6.1.jar'), m
          assert m['resources']['iconUrl'].endswith('/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v106001.png'), m

          hs=dict(hext); hs.pop(package, None)
          cs=dict(cext); cs.pop(package, None)
          if hs != cs:
              raise SystemExit('Formal index changed outside Cyppt; refusing promotion')
          ht=dict(handoff); ht.pop('extensionList', None)
          ct=dict(current); ct.pop('extensionList', None)
          if ht != ct:
              raise SystemExit('Formal index top-level metadata changed; refusing promotion')

          handroid=load(h/'index-android.json')
          candroid=load(r/'index-android.json')
          ha={x['packageName']:x for x in handroid['extensionList']['extensions']}
          ca={x['packageName']:x for x in candroid['extensionList']['extensions']}
          assert package in ha
          assert int(ha[package]['versionCode'])==212001, ha[package]
          ha2=dict(ha); ha2.pop(package, None)
          ca2=dict(ca); ca2.pop(package, None)
          if ha2 != ca2:
              raise SystemExit('Formal Android index changed outside Cyppt; refusing promotion')
          hat=dict(handroid); hat.pop('extensionList', None)
          cat=dict(candroid); cat.pop('extensionList', None)
          if hat != cat:
              raise SystemExit('Formal Android index top-level metadata changed; refusing promotion')

          hstate=load(h/'published-state.json')
          cstate=load(r/'published-state.json')
          assert hstate[package]['versionName']=='1.6.1', hstate[package]
          assert int(hstate[package]['versionCode'])==106001, hstate[package]
          assert int(hstate[package]['androidVersionCode'])==212001, hstate[package]
          hs_state=dict(hstate); hs_state.pop(package, None)
          cs_state=dict(cstate); cs_state.pop(package, None)
          if hs_state != cs_state:
              raise SystemExit('Published state changed outside Cyppt; refusing promotion')

          import hashlib
          for key, filename in [('apkSha256','tachiyomi-zh.cyppt-v1.6.1.apk'), ('jarSha256','tachiyomi-zh.cyppt-v1.6.1.jar')]:
              digest=hashlib.sha256((h/filename).read_bytes()).hexdigest()
              assert digest==hstate[package][key], (key, digest, hstate[package][key])

          print('Cyppt v1.6.1 production handoff verified')
          PY

      - name: Apply Cyppt production handoff only
        shell: bash
        run: |
          set -euo pipefail
          h='staging/production-handoff'
          rm -f repo/tachiyomi-zh.cyppt-v*.apk repo/tachiyomi-zh.cyppt-v*.jar
          rm -f repo/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v*.png
          cp -a "$h/tachiyomi-zh.cyppt-v1.6.1.apk" repo/
          cp -a "$h/tachiyomi-zh.cyppt-v1.6.1.jar" repo/
          mkdir -p repo/icon
          cp -a "$h/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v106001.png" repo/icon/
          for file in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            cp -a "$h/$file" "repo/$file"
          done

      - name: Verify formal snapshot before push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.cyppt'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.1' and int(m[0]['versionCode'])==106001, m
          assert (m[0].get('sources') or [{}])[0].get('name')=='超越漫画网', m
          assert (m[0].get('sources') or [{}])[0].get('homeUrl')=='https://www.cyppt.com', m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212001, a
          state=json.loads(Path('repo/published-state.json').read_text('utf-8'))
          assert int(state[package]['versionCode'])==106001
          assert int(state[package]['androidVersionCode'])==212001
          assert Path('repo/tachiyomi-zh.cyppt-v1.6.1.apk').is_file()
          assert Path('repo/tachiyomi-zh.cyppt-v1.6.1.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v106001.png').is_file()
          print('Cyppt v1.6.1 formal snapshot verified before push')
          PY
          git -C repo add -A
          git -C repo diff --cached --check

      - name: Commit and push formal plugin store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Cyppt v1.6.1 is already published'
          else
            git commit -m 'Publish Cyppt v1.6.1'
            git push origin HEAD:repo
          fi

      - name: Verify pushed formal plugin store
        shell: bash
        run: |
          set -euo pipefail
          git -C repo fetch origin repo
          git -C repo reset --hard origin/repo
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.cyppt'
          normal=json.loads(Path('repo/index.json').read_text('utf-8'))
          m=[x for x in normal['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(m)==1 and m[0]['versionName']=='1.6.1' and int(m[0]['versionCode'])==106001, m
          assert (m[0].get('sources') or [{}])[0].get('name')=='超越漫画网', m
          assert (m[0].get('sources') or [{}])[0].get('homeUrl')=='https://www.cyppt.com', m
          android=json.loads(Path('repo/index-android.json').read_text('utf-8'))
          a=[x for x in android['extensionList']['extensions'] if x.get('packageName')==package]
          assert len(a)==1 and int(a[0]['versionCode'])==212001, a
          state=json.loads(Path('repo/published-state.json').read_text('utf-8'))
          assert int(state[package]['versionCode'])==106001
          assert int(state[package]['androidVersionCode'])==212001
          assert Path('repo/tachiyomi-zh.cyppt-v1.6.1.apk').is_file()
          assert Path('repo/tachiyomi-zh.cyppt-v1.6.1.jar').is_file()
          assert Path('repo/icon/eu.kanade.tachiyomi.extension.zh.cyppt-v106001.png').is_file()
          print('Cyppt v1.6.1 formal store verified after push')
          PY
