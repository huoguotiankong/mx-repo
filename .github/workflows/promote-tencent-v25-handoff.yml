name: Promote Tencent Comics v1.4.25 handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-tencent-v25-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-tencent-v25-handoff
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public repo branch
        uses: actions/checkout@v5
        with:
          ref: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout validated production handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: 1d8cdfefe185937c370b59c6fc6f18fa3c8c8247
          path: handoff
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and copy Tencent v25 production payload
        shell: bash
        run: |
          set -euo pipefail
          src="handoff/production-handoff"
          expected_source="72f7e8a4bbc44e52626d06b883990bcc7d5619b2"
          [[ "$(tr -d '\r\n' < "$src/SOURCE_SHA.txt")" == "$expected_source" ]]
          test -f "$src/tachiyomi-zh.tencentcomics-v1.4.25.apk"
          test -f "$src/tachiyomi-zh.tencentcomics-v1.4.25.jar"
          test -f "$src/icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104025.png"
          for f in index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json; do
            test -f "$src/$f"
            cp "$src/$f" "$f"
          done
          cp "$src/tachiyomi-zh.tencentcomics-v1.4.25.apk" .
          cp "$src/tachiyomi-zh.tencentcomics-v1.4.25.jar" .
          mkdir -p icon
          cp "$src/icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104025.png" icon/
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('index.json').read_text('utf-8'))
          pkg = 'eu.kanade.tachiyomi.extension.zh.tencentcomics'
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == pkg]
          assert len(items) == 1, items
          item = items[0]
          assert item.get('versionName') == '1.4.25', item
          assert str(item.get('versionCode')) == '104025', item
          print('Tencent Comics production index verified:', item['versionName'], item['versionCode'])
          PY
          git diff --check

      - name: Commit public repo update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.min.json index.pb index-android.json index-android.min.json index-android.pb published-state.json \
            tachiyomi-zh.tencentcomics-v1.4.25.apk tachiyomi-zh.tencentcomics-v1.4.25.jar \
            icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104025.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Tencent v25 production payload already present"
          else
            git commit -m "Publish Tencent Comics v1.4.25"
            git push origin HEAD:repo
          fi

      - name: Verify public branch contents
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repo
          git show origin/repo:index.json > /tmp/index.json
          git cat-file -e origin/repo:tachiyomi-zh.tencentcomics-v1.4.25.apk
          git cat-file -e origin/repo:tachiyomi-zh.tencentcomics-v1.4.25.jar
          git cat-file -e origin/repo:icon/eu.kanade.tachiyomi.extension.zh.tencentcomics-v104025.png
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/index.json', encoding='utf-8'))
          pkg = 'eu.kanade.tachiyomi.extension.zh.tencentcomics'
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == pkg)
          assert item['versionName'] == '1.4.25'
          assert str(item['versionCode']) == '104025'
          print('Published Tencent Comics v1.4.25 / 104025 verified on repo branch')
          PY
